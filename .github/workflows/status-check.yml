name: Status check

on:
  schedule:
    # Hourly to stay well within GitHub Actions' private-repo free minutes.
    # A dedicated monitor (UptimeRobot/Better Stack) is better for 1–5 min checks.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check and record status
        env:
          STATUS_CRON_SECRET: ${{ secrets.STATUS_CRON_SECRET }}
        run: |
          body="$(curl -fsS --max-time 30 https://emilioherrera.site/api/status)"
          echo "$body" | jq .
          if [ "$(echo "$body" | jq -r '.status')" != "operational" ]; then
            echo "::error::One or more services are not operational"
            exit 1
          fi

      - name: Record sample to history
        if: always()
        env:
          STATUS_CRON_SECRET: ${{ secrets.STATUS_CRON_SECRET }}
        run: |
          if [ -z "$STATUS_CRON_SECRET" ]; then
            echo "::warning::STATUS_CRON_SECRET is not set; skipping history record."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer ${STATUS_CRON_SECRET}" \
            https://emilioherrera.site/api/status/record | jq .
