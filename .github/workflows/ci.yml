name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone blog vault
        env:
          BLOG_REPO: ${{ vars.BLOG_REPO || 'https://github.com/EmilioBlacksmith/blog.git' }}
          BLOG_REPO_TOKEN: ${{ secrets.BLOG_REPO_TOKEN }}
        run: |
          mkdir -p blog/en blog/es public/blog
          if [ -z "$BLOG_REPO_TOKEN" ]; then
            echo "BLOG_REPO_TOKEN unavailable (e.g. Dependabot PR); building with an empty vault."
            exit 0
          fi
          git clone --depth 1 \
            "https://EmilioBlacksmith:${BLOG_REPO_TOKEN}@${BLOG_REPO#https://}" \
            /tmp/blog
          cp -r /tmp/blog/en/. blog/en/
          cp -r /tmp/blog/es/. blog/es/
          cp -r /tmp/blog/assets/. public/blog/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Unit tests
        run: npm test

      - name: Smoke test
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "health: $(curl -fsS http://127.0.0.1:3000/api/health)"
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          echo "home: 200"
